<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#0e1215;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head>
<body>
<script type="module">
// Point-cloud fly-around, rendered frame by frame by render_lidar.mjs.
// Timeline: the georeferenced cloud coloured by height, then the classes fade in.
import * as THREE from "three";

const W = 1600, H = 900, FPS = 30, SECONDS = 12;
const meta = await (await fetch("work/lidar_meta.json")).json();
const pos = new Float32Array(await (await fetch("work/lidar_pos.bin")).arrayBuffer());
const cls = new Uint8Array(await (await fetch("work/lidar_cls.bin")).arrayBuffer());

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x0e1215);
document.body.appendChild(renderer.domElement);

const geo = new THREE.BufferGeometry();
// three.js is y-up: x east, y height, z south
const p3 = new Float32Array(pos.length);
for (let i = 0; i < pos.length; i += 3) { p3[i] = pos[i]; p3[i + 1] = pos[i + 2]; p3[i + 2] = -pos[i + 1]; }
geo.setAttribute("position", new THREE.BufferAttribute(p3, 3));
geo.setAttribute("cls", new THREE.BufferAttribute(Float32Array.from(cls), 1));

const mat = new THREE.ShaderMaterial({
  uniforms: { uMix: { value: 0 }, uZmax: { value: meta.zmax }, uSize: { value: 2.2 } },
  vertexShader: `
    attribute float cls;
    uniform float uMix, uZmax, uSize;
    varying vec3 vColor;
    vec3 ramp(float t) {               // height: deep slate -> pale sand
      vec3 a = vec3(0.17, 0.24, 0.30), b = vec3(0.42, 0.50, 0.55), c = vec3(0.93, 0.89, 0.80);
      return t < 0.5 ? mix(a, b, t * 2.0) : mix(b, c, t * 2.0 - 1.0);
    }
    vec3 classColor(float c) {
      if (c == 2.0) return vec3(0.62, 0.52, 0.40);                 // ground: contour brown
      if (c == 6.0) return vec3(1.00, 0.42, 0.17);                 // buildings: survey orange
      if (c >= 3.0 && c <= 5.0) return vec3(0.40, 0.63, 0.42);     // vegetation
      if (c == 9.0) return vec3(0.30, 0.55, 0.75);                 // water
      if (c == 20.0) return vec3(0.62, 0.52, 0.40);                // NRW: additional ground class
      return vec3(0.55, 0.60, 0.63);                               // other
    }
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = clamp(uSize * 260.0 / -mv.z, 1.0, 4.0);
      vColor = mix(ramp(clamp(position.y / uZmax, 0.0, 1.0)), classColor(cls), uMix);
    }`,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      if (dot(d, d) > 0.25) discard;
      gl_FragColor = vec4(vColor, 1.0);
    }`,
});
const scene = new THREE.Scene();
scene.add(new THREE.Points(geo, mat));
const camera = new THREE.PerspectiveCamera(42, W / H, 1, 5000);

const smooth = (t) => t * t * (3 - 2 * t);
window.frameCount = FPS * SECONDS;
window.renderFrame = (i) => {
  const t = i / (window.frameCount - 1);
  const a = THREE.MathUtils.degToRad(-30 + 140 * smooth(t));    // orbit
  const r = 420 - 120 * smooth(t), h = 260 - 90 * smooth(t);
  camera.position.set(Math.sin(a) * r, h, Math.cos(a) * r);
  camera.lookAt(0, 25, 0);
  mat.uniforms.uMix.value = smooth(Math.min(1, Math.max(0, (t * SECONDS - 3) / 3)));
  renderer.render(scene, camera);
  return true;
};
window.renderer = renderer.getContext().getParameter(renderer.getContext().RENDERER);
window.ready = true;
</script>
</body>
</html>
